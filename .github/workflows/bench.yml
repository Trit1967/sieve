# SPDX-License-Identifier: MIT OR Apache-2.0
name: Benchmark regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bench:
    name: criterion regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run bundled-corpus benchmark
        run: bash benchmarks/run.sh
      - name: Run criterion benches
        # `--quick` was removed from criterion; pass --sample-size 10 to
        # shrink each measurement to keep the bench job under a few minutes.
        run: cargo bench -p sieve-core --no-fail-fast -- --sample-size 10
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            benchmarks/REPORT.md
            target/criterion/**
