# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "sieve-core"
description = "Vendor-neutral, embeddable, offline-first prompt injection defense library (core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sieve_core"
path = "src/lib.rs"

[dependencies]
# Phase 1: serde for the Verdict schema. thiserror for error types.
# Phase 2: unicode-normalization for NFKC.
# Phase 3: aho-corasick for the curated jailbreak wordlist scanner.
# Phase 4: base64 for the encoding scanner. (hex + rot13 are implemented
# inline; no extra deps.)
# Phase 6: getrandom for canary token generation.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
aho-corasick = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }

[features]
default = []
# BYO-ONNX classifier interface backed by the `ort` crate (Phase 9). Users opt
# in and supply their own model file at runtime — no weights are bundled.
onnx = []

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
base64 = { workspace = true }

[[bench]]
name = "scan"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
