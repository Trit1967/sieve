# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "sieve-wasm"
description = "WebAssembly bindings for sieve (wasm-bindgen)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
name = "sieve_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
sieve-core = { path = "../sieve-core", version = "0.1.0" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }

# getrandom flows in transitively via sieve-core's canary engine. On
# wasm32-unknown-unknown it has no platform syscall to use, so we must
# opt in to the `js` feature (which routes through Web Crypto / Node
# crypto). This dep stanza only applies when compiling for wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[features]
default = []

# Size budget for the compressed wasm bundle is enforced in CI.
# Rust 1.95+ emits bulk-memory ops by default, so wasm-opt has to be told
# to accept them (otherwise it bails with "Bulk memory operations require
# bulk memory [--enable-bulk-memory]").
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
