# SPDX-License-Identifier: MIT OR Apache-2.0
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to publish (e.g. v0.3.0)"
        required: true
        default: "v0.3.0"

permissions:
  contents: write
  id-token: write

jobs:
  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p sieve-core

  publish-pypi:
    name: Publish to PyPI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/sieve-py
          command: build
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/sieve-py/dist/

  pypi-publish:
    name: PyPI upload
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # OIDC trusted-publisher config in PyPI project settings.

  publish-npm-wasm:
    name: Publish @sieve/wasm to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build bundle
        run: wasm-pack build crates/sieve-wasm --release --target bundler
      - name: Rewrite package.json name to @sieve/wasm
        # wasm-pack uses the Cargo crate name `sieve-wasm` as the npm
        # package name. We want the scoped name `@sieve/wasm`. Do a
        # tiny, safe in-place rewrite before publish.
        run: |
          set -e
          cd crates/sieve-wasm/pkg
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.name = '@sieve/wasm';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('name=', p.name);
          "
      - name: Publish
        working-directory: crates/sieve-wasm/pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-nextjs:
    name: Publish @sieve/nextjs to npm
    needs: publish-npm-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - working-directory: packages/nextjs
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub release
    needs: [publish-crates-io, pypi-publish, publish-npm-nextjs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
