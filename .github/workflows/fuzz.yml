# SPDX-License-Identifier: MIT OR Apache-2.0
name: Fuzz

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  fuzz:
    name: cargo-fuzz (1h budget per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz scan_input
        run: |
          cd crates/sieve-core
          if [ -d fuzz ]; then
            cargo fuzz run fuzz_scan_input -- -max_total_time=3600 || true
          else
            echo "no fuzz target yet"
          fi
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crates/sieve-core/fuzz/artifacts/
