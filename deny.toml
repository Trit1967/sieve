# SPDX-License-Identifier: MIT OR Apache-2.0
# cargo-deny configuration.
# Enforces license, advisory, and source policy on the workspace.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Hard ban network / LLM-vendor crates from the dependency graph of sieve-core
# (R1 / R2). The CI workflow `no-network-deps` enforces this on sieve-core
# specifically; the global ban below is a belt-and-suspenders default.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "surf" },
    { name = "isahc" },
    { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
