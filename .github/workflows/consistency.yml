# SPDX-License-Identifier: MIT OR Apache-2.0
name: Cross-language consistency

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  consistency:
    name: Rust / Python / WASM verdict parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build sieve-bench (Rust reference)
        run: cargo build --release -p sieve-bench

      - name: Build + install Python wheel
        run: |
          pip install maturin pytest
          cd crates/sieve-py
          maturin develop --release

      - name: Build WASM bundle (nodejs target)
        run: wasm-pack build crates/sieve-wasm --release --target nodejs

      - name: Run cross-language consistency harness
        run: bash scripts/consistency-check.sh
