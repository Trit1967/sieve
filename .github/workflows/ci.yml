# SPDX-License-Identifier: MIT OR Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.os }} / rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.82" # MSRV per ADR-0003
          - os: ubuntu-latest
            rust: nightly
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features

  no-network-deps:
    name: no-network audit (R1/R2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify no networking / LLM-vendor crates in sieve-core
        run: |
          set -e
          cargo tree -p sieve-core --edges normal --prefix none --format '{p}' > /tmp/core-deps.txt
          BANNED='reqwest|hyper|ureq|surf|isahc|tokio-net|tokio_net|openai|anthropic|llamaindex|langchain'
          if grep -E -i "$BANNED" /tmp/core-deps.txt; then
            echo "FAIL: banned dependency present in sieve-core" >&2
            exit 1
          fi
          echo "OK: sieve-core dependency graph clean"

  coverage:
    name: coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  wasm-build:
    name: WASM build + size budget (<2MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build wasm bundle
        run: wasm-pack build crates/sieve-wasm --release --target web
      - name: Check size budget
        run: |
          set -e
          gzip -c crates/sieve-wasm/pkg/sieve_wasm_bg.wasm > /tmp/wasm.gz
          SIZE=$(stat -c%s /tmp/wasm.gz)
          echo "wasm bundle (compressed): $SIZE bytes"
          if [ "$SIZE" -gt 2097152 ]; then
            echo "FAIL: bundle exceeds 2MB budget" >&2
            exit 1
          fi

  python-build:
    name: Python wheel build (maturin)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        working-directory: crates/sieve-py
        run: maturin build --release
      - name: Test wheel
        working-directory: crates/sieve-py
        run: |
          pip install pytest
          maturin develop --release
          pytest python/sieve/tests/ -q

  nextjs-build:
    name: '@sieve/nextjs build + vitest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: packages/nextjs
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
