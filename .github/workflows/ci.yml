# SPDX-License-Identifier: MIT OR Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.os }} / rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          # MSRV: tracking ADR-0003 but adjusted to 1.85 because clap_lex
          # 1.1.0 (transitive via proptest) requires it.
          - os: ubuntu-latest
            rust: "1.85"
          - os: ubuntu-latest
            rust: nightly
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # sieve-py is a pyo3 `extension-module` cdylib. It's tested via the
      # maturin develop + pytest job above. `cargo test --workspace`
      # without --exclude would try to link Python symbols into a regular
      # test binary, which fails on macOS arm64 even with the
      # .cargo/config.toml `-undefined dynamic_lookup` flag.
      - run: cargo test --workspace --exclude sieve-py --all-features --no-fail-fast

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features

  no-network-deps:
    name: no-network audit (R1/R2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify no networking / LLM-vendor crates in sieve-core
        run: |
          set -e
          cargo tree -p sieve-core --edges normal --prefix none --format '{p}' > /tmp/core-deps.txt
          BANNED='reqwest|hyper|ureq|surf|isahc|tokio-net|tokio_net|openai|anthropic|llamaindex|langchain'
          if grep -E -i "$BANNED" /tmp/core-deps.txt; then
            echo "FAIL: banned dependency present in sieve-core" >&2
            exit 1
          fi
          echo "OK: sieve-core dependency graph clean"

  coverage:
    name: coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  wasm-build:
    name: WASM build + size budget (<2MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build wasm bundle
        run: wasm-pack build crates/sieve-wasm --release --target web
      - name: Check size budget
        run: |
          set -e
          gzip -c crates/sieve-wasm/pkg/sieve_wasm_bg.wasm > /tmp/wasm.gz
          SIZE=$(stat -c%s /tmp/wasm.gz)
          echo "wasm bundle (compressed): $SIZE bytes"
          if [ "$SIZE" -gt 2097152 ]; then
            echo "FAIL: bundle exceeds 2MB budget" >&2
            exit 1
          fi

  python-build:
    name: Python wheel build (maturin)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        working-directory: crates/sieve-py
        run: maturin build --release
      - name: Create virtualenv
        # maturin develop requires a venv. Cross-platform setup via venv
        # + activation file pinned to GITHUB_ENV / GITHUB_PATH.
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "VIRTUAL_ENV=$(pwd)/.venv" >> "$GITHUB_ENV"
            echo "$(pwd)/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "VIRTUAL_ENV=$(pwd)/.venv" >> "$GITHUB_ENV"
            echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pytest
        shell: bash
        # `python -m pip` forces the active venv's Python (vs `pip` which
        # on Windows resolves to a different runner-global Scripts dir).
        run: python -m pip install pytest
      - name: maturin develop
        working-directory: crates/sieve-py
        shell: bash
        run: maturin develop --release
      - name: Run pytest
        working-directory: crates/sieve-py
        shell: bash
        # Use `python -m pytest` so the active venv's Python is what runs
        # the test runner — Windows otherwise resolved `pytest` to a stale
        # PATH entry that didn't import from the venv.
        run: python -m pytest python/sieve/tests/ -q

  nextjs-build:
    name: 'sieve-guard-nextjs build + 1000-case canary plumbing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: packages/nextjs
        # --legacy-peer-deps tells npm to skip peer-dependency resolution
        # for sieve-guard-wasm (which isn't on the npm registry yet at PR
        # time — it gets published from the same release pipeline). The
        # vitest tests mock sieve-guard-wasm anyway.
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run typecheck
          npm test

  sample-install-smoke:
    name: sample install smoke (local package shape)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: jetli/wasm-pack-action@v0.4.0
      - working-directory: packages/nextjs
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Pack and import local packages in a clean temp app
        run: node scripts/sample-install-smoke.mjs

  real-app-smoke:
    name: real app smoke (FastAPI + Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Create Python virtualenv
        shell: bash
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> "$GITHUB_ENV"
          echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Python app smoke dependencies
        run: python -m pip install maturin fastapi openai httpx
      - name: Install Python package in editable mode
        working-directory: crates/sieve-py
        run: maturin develop --release
      - name: Run FastAPI real app smoke
        run: python scripts/fastapi-real-app-smoke.py
      - name: Install Next.js package dependencies
        working-directory: packages/nextjs
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run Next.js real app smoke
        run: node scripts/nextjs-real-app-smoke.mjs
