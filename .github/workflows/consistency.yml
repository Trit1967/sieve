# SPDX-License-Identifier: MIT OR Apache-2.0
name: Cross-language consistency

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  consistency:
    name: Rust / Python / WASM verdict parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build sieve-bench (Rust reference)
        run: cargo build --release -p sieve-bench

      - name: Build + install Python wheel
        # maturin develop requires a virtualenv. Create one + activate.
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          cd crates/sieve-py
          maturin develop --release
          # Persist the venv path for the next step.
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run cross-language consistency harness (Rust + Python)
        # WASM-from-Node deferred to v0.1.1 — see scripts/consistency-check.sh header.
        run: bash scripts/consistency-check.sh
