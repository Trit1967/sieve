# SPDX-License-Identifier: MIT OR Apache-2.0
[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "sieve"
version = "0.1.0"
description = "Vendor-neutral, offline-first prompt injection defense library"
readme = "../../README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "The sieve contributors" }]
keywords = ["prompt-injection", "llm", "security", "ai-safety", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
test = ["pytest>=7", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/Trit1967/sieve"
Repository = "https://github.com/Trit1967/sieve"
Issues = "https://github.com/Trit1967/sieve/issues"

[tool.maturin]
features = []
module-name = "sieve._native"
python-source = "python"
manifest-path = "Cargo.toml"
