# SPDX-License-Identifier: MIT OR Apache-2.0
[workspace]
resolver = "2"
members = [
    "crates/sieve-core",
    "crates/sieve-cli",
    "crates/sieve-py",
    "crates/sieve-wasm",
    "examples/rust-basic",
    "benchmarks/harness",
]
exclude = [
    "crates/sieve-core/fuzz",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["The sieve contributors"]
repository = "https://github.com/Trit1967/sieve"
homepage = "https://github.com/Trit1967/sieve"
readme = "README.md"
keywords = ["prompt-injection", "llm", "security", "ai-safety"]
categories = ["text-processing", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Detector deps (shared across core + bindings)
aho-corasick = "1"
unicode-normalization = "0.1"
regex = "1"
getrandom = "0.2"
base64 = "0.22"

# Optional / feature-gated
ort = { version = "2.0.0-rc.6", default-features = false }

# Test infra
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
lto = "thin"
codegen-units = 1
