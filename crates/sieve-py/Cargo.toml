# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "sieve-py"
description = "Python bindings for sieve (pyo3 / maturin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
# The actual Python module is named `_native` and bundled inside the
# `sieve` Python package (see pyproject.toml `module-name`).
name = "sieve_native"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
sieve-core = { path = "../sieve-core", version = "0.1.0" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
serde_json = { workspace = true }

[features]
default = []
